appId: com.richarddeweyhammers.finances-os
productName: Finances OS
copyright: Copyright © 2026 Richard Dewey Hammers
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
      - prisma/template.db
asarUnpack:
  - prisma/**
extraResources:
  - from: node_modules/.prisma/client/query_engine-windows.dll.node
    to: prisma/query_engine-windows.dll.node
# No `publish` block on purpose (Oct 30 2026): there are no GitHub Releases
# and no in-app updater any more. `npm run build` still passes
# `--publish never` so electron-builder never tries to publish on its own.
win:
  icon: resources/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Finances OS
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # No spaces in the file name (kept from the GitHub Release days, where an
  # asset name with spaces was mangled by GitHub).
  artifactName: Finances-OS-Setup-${version}.${ext}
portable:
  artifactName: Finances-OS-${version}-portable.${ext}
