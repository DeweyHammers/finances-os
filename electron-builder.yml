appId: com.richarddeweyhammers.finances-os
productName: Finances OS
copyright: Copyright © 2026 Richard Dewey Hammers
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
      - prisma/template.db
asarUnpack:
  - prisma/**
extraResources:
  - from: node_modules/.prisma/client/query_engine-windows.dll.node
    to: prisma/query_engine-windows.dll.node
# In-app updates (CLAUDE.md → "Updates"). The GitHub provider makes
# electron-builder write `dist/latest.yml` (version + installer name + sha512
# + blockmap) and bake `resources/app-update.yml` (owner/repo) into the app,
# which electron-updater reads at runtime to find new Releases. Nothing is
# uploaded by electron-builder itself: `npm run build` passes `--publish never`
# and the release workflow attaches latest.yml to the Release alongside the
# installer. Without `--publish never`, electron-builder would try to publish
# on its own whenever GitHub Actions runs on a tag (and fail for lack of a
# token).
publish:
  provider: github
  owner: DeweyHammers
  repo: finances-os
win:
  icon: resources/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Finances OS
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # No spaces in the file name: GitHub stores an asset "A B.exe" as "A.B.exe"
  # while electron-updater asks for "A-B.exe", so a name with spaces never
  # downloads. (Was "Finances OS Setup X.Y.Z.exe" up to v1.2.0.)
  artifactName: Finances-OS-Setup-${version}.${ext}
portable:
  artifactName: Finances-OS-${version}-portable.${ext}
