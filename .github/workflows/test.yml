# Test — runs the Vitest suite on every push and pull request, so `main` stays
# green for anyone who clones the repo.
#
# This is the whole of GitHub Actions for this project since Oct 30 2026: there
# are no GitHub Releases, installers or in-app updates any more (the app is an
# alpha used on the author's PC, deployed there with `npm run deploy:prod` —
# see scripts/deploy-prod.mjs and CLAUDE.md → "PROD Deployment Flow").
#
# CI=true is set by GitHub Actions, so a missing snapshot fails instead of
# being written. The lock-in tests on real data are gitignored and simply
# aren't here.
name: Test

# Once per commit: pull requests, and pushes to main. (push + pull_request on a
# PR branch ran the suite twice per commit on two runners; one of the pair
# timed out in its hooks on Oct 30 2026 while the other passed.)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest
    runs-on: windows-latest
    # Install (~2 min) + the four test steps' own limits below.
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # scripts/empty-db.mjs (the test database) uses node:sqlite (Node ≥ 22.13).
          node-version: 24
          cache: npm

      # `postinstall` runs electron-builder install-app-deps.
      - name: Install dependencies
        run: npm ci

      # The suite runs in two parts, each with its own time limit and one retry,
      # because of what the hosted runner did on Oct 30 2026: one run had a
      # Vitest worker die mid-file (native libsql under load), another sat for
      # 18 minutes with the JS thread blocked inside a native libsql sync call
      # in main/sync.routes.test.ts — a hang Vitest's own timeouts can't break,
      # which ate the whole job's budget before the retry could start. The
      # same commits passed on their twin runs and locally every time. A step
      # that hangs is cancelled by its timeout and counts as a failure, so the
      # retry still runs; a real failure fails twice and turns the check red.
      - name: Test (everything but the sync tests)
        id: test
        run: npx vitest run --exclude main/sync.routes.test.ts
        continue-on-error: true
        timeout-minutes: 12

      - name: Test (everything but the sync tests) — retry once
        if: steps.test.outcome == 'failure'
        run: npx vitest run --exclude main/sync.routes.test.ts
        timeout-minutes: 12

      - name: Sync tests
        id: sync
        run: npx vitest run main/sync.routes.test.ts
        continue-on-error: true
        timeout-minutes: 6

      - name: Sync tests — retry once
        if: steps.sync.outcome == 'failure'
        run: npx vitest run main/sync.routes.test.ts
        timeout-minutes: 6
